<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Hit Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>🏏 Cricket Hit Game</h1>
      <p>Press <kbd>Space</kbd> to hit the ball</p>
    </header>

    <section class="game-container">
      <canvas id="gameCanvas"></canvas>
    </section>

    <footer class="footer">
      <p>Controls: Space = Hit | R = Restart</p>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
